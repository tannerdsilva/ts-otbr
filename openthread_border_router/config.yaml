---
version: 2.1.10
breaking_versions: [2.1.0]
slug: tanners_openthread_border_router
name: Tanners OpenThread Border Router
description: Tanners OpenThread Border Router app
url: >-
  https://github.com/tannerdsilva/ts-otbr/tree/master/openthread_border_router
arch:
  - aarch64
  - amd64
homeassistant: 2025.7.0
gpio: true
hassio_api: true
discovery:
  - otbr
# IPC is only used within the Add-on
host_ipc: false
host_network: true
host_uts: true
privileged:
  - IPC_LOCK
  - NET_ADMIN
devices:
  - /dev/net/tun
data:
  - /var/lib/thread
init: false
options:
  device: null
  baudrate: "460800"
  flow_control: true
  otbr_log_level: notice
  firewall: true
  nat64: false
  beta: false
  custom_omr_prefix: ""
  custom_omr_preference: "med"
  custom_onlink_prefix: ""
  custom_route_preference: "med"
  8080/tcp: null
  8081/tcp: null
ports_description:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
schema:
  device: device(subsystem=tty)
  baudrate: list(57600|115200|230400|460800|921600|1000000)
  flow_control: bool
  backbone_interface: str?
  network_device: str?
  otbr_log_level: list(debug|info|notice|warning|error|critical|alert|emergency)
  firewall: bool
  nat64: bool
  beta: bool?
  custom_omr_prefix: str?
  custom_omr_preference: list(high|med|low)?
  custom_onlink_prefix: str?
  custom_route_preference: list(high|med|low)?

startup: services
